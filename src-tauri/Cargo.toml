[package]
name = "clean-your-tv-companion"
version = "0.1.2"
description = "A local companion for Android TV"
authors = ["Hari Haran"]
edition = "2021"
license = "MIT"

[lib]
name = "clean_your_tv_companion_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "io-util", "macros"] }
